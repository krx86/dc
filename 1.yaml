blueprint:
  name: ZHA - Tuya 3-Button Scene Switch
  description: Automate your Tuya 3-Button Scene Switch (TS0043) via ZHA.
  domain: automation
  input:
    switch:
      name: Tuya Zigbee Switch
      description: Tuya 3-Button Scene Switch to use
      selector:
        device:
          integration: zha
          model: TS0043
    single_press_1:
      name: Single Press - Button 1
      description: Action to run on button 1 (top) single press
      default: []
      selector:
        action: {}
    long_press_1:
      name: Hold - Button 1
      description: Action to run on button 1 (top) long press
      default: []
      selector:
        action: {}
    double_press_1:
      name: Double Press - Button 1
      description: Action to run on button 1 (top) double press
      default: []
      selector:
        action: {}
    single_press_2:
      name: Single Press - Button 2
      description: Action to run on button 2 (middle) single press
      default: []
      selector:
        action: {}
    long_press_2:
      name: Hold - Button 2
      description: Action to run on button 2 (middle) long press
      default: []
      selector:
        action: {}
    double_press_2:
      name: Double Press - Button 2
      description: Action to run on button 2 (middle) double press
      default: []
      selector:
        action: {}
    single_press_3:
      name: Single Press - Button 3
      description: Action to run on button 3 (bottom) single press
      default: []
      selector:
        action: {}
    long_press_3:
      name: Hold - Button 3
      description: Action to run on button 3 (bottom) long press
      default: []
      selector:
        action: {}
    double_press_3:
      name: Double Press - Button 3
      description: Action to run on button 3 (bottom) double press
      default: []
      selector:
        action: {}
mode: parallel
max_exceeded: silent
trigger:
- platform: event
  event_type: zha_event
  event_data:
    device_id: !input switch
action:
- variables:
    command: '{{ trigger.event.data.command }}'
    cluster_id: '{{ trigger.event.data.cluster_id }}'
    endpoint_id: '{{ trigger.event.data.endpoint_id }}'
- choose:
  - conditions:
    - '{{ command == ''remote_button_short_press'' }}'
    - '{{ cluster_id == 6 }}'
    - '{{ endpoint_id == 1 }}'
    sequence: !input single_press_1
  - conditions:
    - '{{ command == ''remote_button_short_press'' }}'
    - '{{ cluster_id == 6 }}'
    - '{{ endpoint_id == 2 }}'
    sequence: !input single_press_2
  - conditions:
    - '{{ command == ''remote_button_short_press'' }}'
    - '{{ cluster_id == 6 }}'
    - '{{ endpoint_id == 3 }}'
    sequence: !input single_press_3
  - conditions:
    - '{{ command == ''remote_button_double_press'' }}'
    - '{{ cluster_id == 6 }}'
    - '{{ endpoint_id == 1 }}'
    sequence: !input double_press_1
  - conditions:
    - '{{ command == ''remote_button_double_press'' }}'
    - '{{ cluster_id == 6 }}'
    - '{{ endpoint_id == 2 }}'
    sequence: !input double_press_2
  - conditions:
    - '{{ command == ''remote_button_double_press'' }}'
    - '{{ cluster_id == 6 }}'
    - '{{ endpoint_id == 3 }}'
    sequence: !input double_press_3
  - conditions:
    - '{{ command == ''remote_button_long_press'' }}'
    - '{{ cluster_id == 6 }}'
    - '{{ endpoint_id == 1 }}'
    sequence: !input long_press_1
  - conditions:
    - '{{ command == ''remote_button_long_press'' }}'
    - '{{ cluster_id == 6 }}'
    - '{{ endpoint_id == 2 }}'
    sequence: !input long_press_2
  - conditions:
    - '{{ command == ''remote_button_long_press'' }}'
    - '{{ cluster_id == 6 }}'
    - '{{ endpoint_id == 3 }}'
    sequence: !input long_press_3
